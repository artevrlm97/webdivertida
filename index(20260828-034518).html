<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ff5d8f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Una prueba muy importante 💘</title>

  <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">💗</text></svg>'>

  <style>
    :root{
      --pink:#ff5d8f;
      --pink-dark:#e83e73;
      --rose:#ff8fb4;
      --cream:#fff8fb;
      --ink:#56313f;
      --card:rgba(255,255,255,.88);
      --shadow:0 20px 60px rgba(145, 47, 83, .18);
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    html,body{
      margin:0;
      min-height:100%;
      font-family: Inter, ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background:
        radial-gradient(circle at 10% 0%, #ffd5e4 0 14%, transparent 35%),
        radial-gradient(circle at 90% 10%, #ffe3ec 0 14%, transparent 32%),
        linear-gradient(180deg,#fff4f8 0%,#fffafc 45%,#ffeef5 100%);
      color:var(--ink);
      overflow-x:hidden;
    }

    body{
      min-height:100svh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:
        max(18px, env(safe-area-inset-top))
        16px
        max(22px, env(safe-area-inset-bottom));
      position:relative;
    }

    .ambient{
      position:fixed;
      inset:0;
      pointer-events:none;
      overflow:hidden;
      z-index:0;
    }

    .float{
      position:absolute;
      opacity:.15;
      animation:floatUp linear infinite;
      filter:drop-shadow(0 4px 10px rgba(255,93,143,.15));
      user-select:none;
    }

    @keyframes floatUp{
      from{transform:translateY(105vh) rotate(0deg) scale(.85)}
      to{transform:translateY(-20vh) rotate(360deg) scale(1.15)}
    }

    .app{
      width:min(100%, 440px);
      position:relative;
      z-index:2;
    }

    .topbar{
      display:flex;
      align-items:center;
      gap:12px;
      margin:0 2px 14px;
    }

    .progress-wrap{
      flex:1;
      height:10px;
      background:rgba(255,255,255,.7);
      border:1px solid rgba(255,93,143,.16);
      border-radius:999px;
      overflow:hidden;
      box-shadow:inset 0 1px 3px rgba(0,0,0,.05);
    }

    .progress{
      height:100%;
      width:0%;
      border-radius:inherit;
      background:linear-gradient(90deg,#ff8fb4,#ff5d8f,#ff3878);
      transition:width .45s cubic-bezier(.2,.8,.2,1);
    }

    .counter{
      font-size:12px;
      font-weight:800;
      color:#b34c70;
      background:rgba(255,255,255,.75);
      border:1px solid rgba(255,93,143,.16);
      padding:7px 10px;
      border-radius:999px;
      min-width:58px;
      text-align:center;
    }

    .card{
      background:var(--card);
      backdrop-filter:blur(16px);
      -webkit-backdrop-filter:blur(16px);
      border:1px solid rgba(255,255,255,.85);
      border-radius:30px;
      box-shadow:var(--shadow);
      overflow:hidden;
      position:relative;
      min-height:520px;
      padding:28px 22px 22px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      transform-origin:center;
    }

    .card::before{
      content:"";
      position:absolute;
      inset:0 0 auto 0;
      height:5px;
      background:linear-gradient(90deg,#ffd1df,#ff5d8f,#ffd1df);
    }

    .eyebrow{
      display:inline-flex;
      align-items:center;
      gap:7px;
      align-self:flex-start;
      margin-bottom:13px;
      padding:7px 11px;
      border-radius:999px;
      background:#fff0f5;
      color:#c34672;
      font-size:12px;
      font-weight:900;
      letter-spacing:.04em;
      text-transform:uppercase;
    }

    .emoji{
      font-size:58px;
      line-height:1;
      margin:0 0 14px;
      animation:bob 2.8s ease-in-out infinite;
      filter:drop-shadow(0 7px 12px rgba(255,93,143,.16));
    }

    @keyframes bob{
      0%,100%{transform:translateY(0) rotate(-2deg)}
      50%{transform:translateY(-7px) rotate(2deg)}
    }

    h1,h2{
      margin:0;
      text-wrap:balance;
    }

    h1{
      font-size:clamp(31px,8vw,42px);
      line-height:1.03;
      letter-spacing:-.045em;
    }

    h2{
      font-size:clamp(25px,6.7vw,33px);
      line-height:1.08;
      letter-spacing:-.035em;
    }

    .subtitle{
      font-size:15px;
      line-height:1.6;
      margin:14px 0 0;
      color:#805466;
    }

    .answers{
      margin-top:22px;
      display:grid;
      gap:11px;
    }

    button{
      font:inherit;
      border:none;
      cursor:pointer;
      touch-action:manipulation;
    }

    .answer{
      width:100%;
      text-align:left;
      padding:15px 16px;
      border-radius:18px;
      background:rgba(255,255,255,.97);
      color:#633749;
      border:1.5px solid #ffd2e0;
      box-shadow:0 7px 20px rgba(133,47,80,.08);
      font-weight:750;
      line-height:1.35;
      display:flex;
      align-items:flex-start;
      gap:11px;
      transition:transform .16s ease, border-color .16s ease, box-shadow .16s ease, background .16s ease;
    }

    .answer:active{
      transform:scale(.975);
    }

    .answer:hover{
      border-color:#ff8fb4;
      box-shadow:0 10px 28px rgba(133,47,80,.13);
      background:#fffafd;
    }

    .letter{
      flex:0 0 29px;
      width:29px;
      height:29px;
      border-radius:50%;
      display:grid;
      place-items:center;
      font-weight:900;
      color:#d13e72;
      background:#fff0f5;
    }

    .primary{
      margin-top:24px;
      width:100%;
      padding:16px 18px;
      border-radius:18px;
      color:white;
      background:linear-gradient(135deg,#ff6b9b,#ff3e7f);
      box-shadow:0 13px 28px rgba(255,62,127,.28);
      font-weight:900;
      letter-spacing:.01em;
      transition:transform .16s ease, box-shadow .16s ease;
    }

    .primary:active{
      transform:scale(.975);
      box-shadow:0 8px 18px rgba(255,62,127,.22);
    }

    .result{
      margin-top:18px;
      padding:18px;
      border-radius:22px;
      background:linear-gradient(135deg,#fff1f6,#fff9fb);
      border:1px solid #ffcadd;
      box-shadow:0 10px 30px rgba(143,47,82,.08);
      animation:pop .42s cubic-bezier(.2,.9,.2,1);
    }

    .result strong{
      display:block;
      color:#e13d76;
      margin-bottom:7px;
      font-size:16px;
    }

    .result p{
      margin:0;
      font-size:15px;
      line-height:1.58;
      color:#6e4153;
    }

    @keyframes pop{
      from{opacity:0; transform:scale(.92) translateY(8px)}
      to{opacity:1; transform:scale(1) translateY(0)}
    }

    .hide{display:none!important}

    .enter{
      animation:cardIn .48s cubic-bezier(.18,.88,.28,1);
    }

    .exit{
      animation:cardOut .25s ease forwards;
    }

    @keyframes cardIn{
      from{opacity:0;transform:translateY(18px) scale(.97)}
      to{opacity:1;transform:translateY(0) scale(1)}
    }

    @keyframes cardOut{
      to{opacity:0;transform:translateY(-12px) scale(.98)}
    }

    .intro-hearts{
      font-size:34px;
      letter-spacing:5px;
      margin-bottom:18px;
      animation:pulse 1.9s ease-in-out infinite;
    }

    @keyframes pulse{
      50%{transform:scale(1.05)}
    }

    .tiny{
      margin-top:13px;
      font-size:12px;
      color:#aa7589;
      text-align:center;
    }

    .final{
      text-align:center;
      align-items:center;
      justify-content:center;
    }

    .final .emoji{
      font-size:72px;
    }

    .final h2{
      font-size:clamp(32px,9vw,45px);
      color:#da356d;
    }

    .final .love{
      margin:18px 0 0;
      font-size:18px;
      font-weight:800;
      line-height:1.55;
      color:#714154;
    }

    .kiss{
      margin:20px auto 0;
      width:min(240px,100%);
      aspect-ratio:1.8/1;
      border-radius:24px;
      display:grid;
      place-items:center;
      font-size:52px;
      background:linear-gradient(145deg,#fff0f5,#ffe0ea);
      border:1px solid #ffc4d7;
      box-shadow:0 13px 35px rgba(187,58,105,.13);
      animation:pulse 1.8s ease-in-out infinite;
    }

    .spark{
      position:fixed;
      z-index:999;
      pointer-events:none;
      animation:burst 900ms ease-out forwards;
      font-size:22px;
    }

    @keyframes burst{
      0%{opacity:1;transform:translate(0,0) scale(.7) rotate(0)}
      100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1.35) rotate(180deg)}
    }

    .footer{
      margin-top:13px;
      text-align:center;
      color:#b17a8e;
      font-size:11px;
    }

    @media (max-width:360px){
      .card{padding:24px 17px 18px; border-radius:25px; min-height:500px}
      .answer{padding:13px 14px; font-size:14px}
      .emoji{font-size:50px}
    }

    @media (min-height:780px){
      .card{min-height:590px}
    }
  </style>
</head>

<body>
  <div class="ambient" id="ambient"></div>

  <main class="app">
    <div class="topbar hide" id="topbar">
      <div class="progress-wrap"><div class="progress" id="progress"></div></div>
      <div class="counter" id="counter">1 / 8</div>
    </div>

    <section class="card enter" id="card"></section>

    <div class="footer">Hecho con cantidades irresponsables de amor 💗✨</div>
  </main>

  <script>
    const questions = [
      {
        emoji: "🥹💗",
        tag: "Pregunta importantísima",
        q: "¿Sabes que te amo?",
        options: ["SÍ 💘", "NO 🙄"],
        custom: (index) => index === 1
          ? "TU DEDO FALLÓ, ASUMIRÉ QUE DIJISTE QUE SÍ. 😌💗"
          : "MUY BIEN. AL MENOS UNA RESPUESTA FÁCIL. 😌💞"
      },
      {
        emoji: "🐶🦴💗",
        tag: "Situación hipotética",
        q: "Si un día me convierto en un tierno perrito callejero, ¿qué harías conmigo?",
        options: [
          "Llevarme al veterinario y adoptarme. 🩺🐾",
          "Bañarme y darme de comer mis croquetas favoritas. 🛁🦴",
          "Dejarme dormir en tu cama todos los días. 🛏️🐶"
        ],
        resultTitle: "Ninguna 😌",
        result: "La respuesta correcta es que me llevarías a un desfile de modas canino porque, incluso siendo perro, sería el más guapo de tu vida. 🐕✨👑"
      },
      {
        emoji: "🧩💞",
        tag: "Pregunta peligrosa",
        q: "Si pudieras cambiar una sola cosa de mí, ¿qué cambiarías?",
        options: [
          "Que deje de perder siempre las llaves/el teléfono. 🔑📱",
          "Que no use tanta ropa negra / que me vista mejor. 🖤👕",
          "Que no sea tan distraído cuando me hablas. 😵‍💫💬"
        ],
        resultTitle: "Falso 🚨",
        result: "No puedes cambiar nada, porque si me quitas un solo defecto me desconfiguro y ya no sabría cómo amarte tanto. ⚙️💗🥺"
      },
      {
        emoji: "👽🛸🫶",
        tag: "Emergencia intergaláctica",
        q: "Si un extraterrestre me abduce y me borra la memoria, ¿cómo me recordarías quién eres?",
        options: [
          "Me enseñarías nuestras fotos más bonitas de Instagram. 📸💕",
          "Me llevarías a comer mi comida favorita para activar mi cerebro. 🍜🧠",
          "Me darías un beso apasionado de película. 🎬🫶"
        ],
        resultTitle: "Falso 👽❌",
        result: "No tendrías que hacer nada; mi corazón late en un código secreto que solo tú sabes descifrar, así que me volvería a enamorar de ti en tres segundos aunque no sepa ni mi propio nombre. 💓🔐✨"
      },
      {
        emoji: "🧠➡️❤️",
        tag: "Matemáticas del amor",
        q: "¿Cuánto espacio ocupas en mi mente durante todo el día?",
        options: [
          "Un 50%, el resto es trabajo y comida. 🍔💼",
          "Un 80%, eres casi mi único pensamiento. 💭💗",
          "Un 99%, estás presente en todo momento. ♾️🥰"
        ],
        resultTitle: "Mal 😌",
        result: "La respuesta es el 0%. Tú no ocupas espacio en mi mente porque ya te mudaste por completo a mi corazón, y ahí no pagas renta. 🏠❤️🔑"
      },
      {
        emoji: "🚨🕵️‍♀️💘",
        tag: "Caso confidencial",
        q: "Si cometieras un crimen y te persiguiera el FBI, ¿qué haría yo para protegerte?",
        options: [
          "Te escondo debajo de la cama y les digo que no estás. 🛏️🤫",
          "Te ayudo a empacar y nos mudamos a un país sin extradición. 🧳✈️",
          "Me culpo a mí mismo para que tú quedes libre. 🫡💗"
        ],
        resultTitle: "Incorrecto 🚔",
        result: "Me hago el líder de tu banda criminal, porque si vas a ir a la cárcel, nos vamos en celda compartida y decoramos las paredes con corazones. 💕🔒😎"
      },
      {
        emoji: "🪞💗🌷",
        tag: "Protocolo anti-días-feos",
        q: "Si un día te despiertas sintiéndote fea y de mal humor, ¿qué solución te daría yo?",
        options: [
          "Te llevaría un café a la cama y te daría tu espacio. ☕🛏️",
          "Te diría que eres hermosa aunque estés despeinada. 🥺💞",
          "Te compraría tu ropa o maquillaje favorito para animarte. 👗💄"
        ],
        resultTitle: "Error total 😤💗",
        result: "Te rompería todos los espejos de la casa. No los necesitas, porque la única forma real de ver lo hermosa que eres es mirándote a través de mis ojos. 👀✨❤️"
      },
      {
        emoji: "🔥🍳🫶",
        tag: "Final culinario",
        q: "Si estuviéramos en un concurso de cocina y se nos quema la cena por completo, ¿cómo ganaríamos el premio?",
        options: [
          "Le echamos la culpa al horno que estaba defectuoso. 🔥😇",
          "Pedimos comida a domicilio en secreto y la emplatamos bonito. 🥡✨",
          "Lloramos frente a los jueces para darles lástima. 😭🏆"
        ],
        resultTitle: "Mal 😌",
        result: "Te doy un beso frente a los jueces. Quedaría claro que el plato se quemó porque el verdadero fuego y sazón de esa cocina somos tú y yo. Ganamos por puro romance. 🔥🫶🏆❤️"
      }
    ];

    const card = document.getElementById("card");
    const progress = document.getElementById("progress");
    const counter = document.getElementById("counter");
    const topbar = document.getElementById("topbar");
    const ambient = document.getElementById("ambient");

    let current = -1;
    let locked = false;

    function createAmbient(){
      const icons = ["💗","💕","✨","💘","🌷","💞","🥰","💓"];
      for(let i=0;i<22;i++){
        const s = document.createElement("span");
        s.className = "float";
        s.textContent = icons[Math.floor(Math.random()*icons.length)];
        s.style.left = Math.random()*100 + "vw";
        s.style.fontSize = (16 + Math.random()*22) + "px";
        s.style.animationDuration = (10 + Math.random()*15) + "s";
        s.style.animationDelay = (-Math.random()*18) + "s";
        ambient.appendChild(s);
      }
    }

    function vibrate(ms=25){
      if("vibrate" in navigator) navigator.vibrate(ms);
    }

    function burst(x, y, amount=14){
      const chars = ["💗","✨","💕","💘","🌸"];
      for(let i=0;i<amount;i++){
        const el = document.createElement("span");
        el.className = "spark";
        el.textContent = chars[Math.floor(Math.random()*chars.length)];
        el.style.left = x + "px";
        el.style.top = y + "px";
        const angle = Math.random()*Math.PI*2;
        const distance = 55 + Math.random()*105;
        el.style.setProperty("--x", Math.cos(angle)*distance + "px");
        el.style.setProperty("--y", Math.sin(angle)*distance + "px");
        document.body.appendChild(el);
        setTimeout(()=>el.remove(), 920);
      }
    }

    function intro(){
      topbar.classList.add("hide");
      card.className = "card enter";
      card.innerHTML = `
        <div class="intro-hearts">💗 💘 💞</div>
        <span class="eyebrow">⚠️ Examen romántico oficial</span>
        <h1>Una prueba muy importante sobre nosotros 😌💗</h1>
        <p class="subtitle">
          Hay respuestas correctas, respuestas incorrectas… y respuestas que yo voy a corregir a mi conveniencia. 🥰
        </p>
        <button class="primary" id="startBtn">Empezar la prueba 💘</button>
        <div class="tiny">Advertencia: este examen está descaradamente manipulado. 😌</div>
      `;
      document.getElementById("startBtn").addEventListener("click", (e)=>{
        vibrate(25);
        burst(e.clientX, e.clientY, 18);
        current = 0;
        showQuestion();
      });
    }

    function showQuestion(){
      locked = false;
      topbar.classList.remove("hide");
      const q = questions[current];
      const pct = ((current)/questions.length)*100;
      progress.style.width = pct + "%";
      counter.textContent = `${current+1} / ${questions.length}`;

      card.className = "card enter";
      card.innerHTML = `
        <span class="eyebrow">${q.tag}</span>
        <div class="emoji">${q.emoji}</div>
        <h2>${q.q}</h2>
        <div class="answers" id="answers">
          ${q.options.map((opt,i)=>`
            <button class="answer" data-index="${i}">
              <span class="letter">${String.fromCharCode(65+i)}</span>
              <span>${opt}</span>
            </button>
          `).join("")}
        </div>
        <div id="resultBox"></div>
      `;

      document.querySelectorAll(".answer").forEach(btn=>{
        btn.addEventListener("click", (e)=>selectAnswer(Number(btn.dataset.index), e));
      });

      window.scrollTo({top:0, behavior:"smooth"});
    }

    function selectAnswer(index, e){
      if(locked) return;
      locked = true;
      vibrate(35);
      burst(e.clientX || innerWidth/2, e.clientY || innerHeight/2, 12);

      document.querySelectorAll(".answer").forEach((b,i)=>{
        b.disabled = true;
        b.style.opacity = i === index ? "1" : ".52";
        if(i === index){
          b.style.borderColor = "#ff6b9b";
          b.style.background = "#fff2f7";
          b.style.transform = "scale(.985)";
        }
      });

      const q = questions[current];
      let title = q.resultTitle || "Respuesta registrada 💗";
      let text = q.result || "";
      if(q.custom){
        text = q.custom(index);
        title = index === 1 ? "Corrección automática 😌" : "Correcto 💞";
      }

      const resultBox = document.getElementById("resultBox");
      resultBox.innerHTML = `
        <div class="result">
          <strong>${title}</strong>
          <p>${text}</p>
        </div>
        <button class="primary" id="nextBtn">
          ${current === questions.length-1 ? "Ver el resultado final 💗" : "Siguiente 💘"}
        </button>
      `;

      document.getElementById("nextBtn").addEventListener("click", (ev)=>{
        vibrate(25);
        burst(ev.clientX || innerWidth/2, ev.clientY || innerHeight/2, 15);
        next();
      });

      setTimeout(()=>{
        document.getElementById("nextBtn").scrollIntoView({behavior:"smooth", block:"nearest"});
      }, 120);
    }

    function next(){
      if(current < questions.length - 1){
        current++;
        card.classList.remove("enter");
        card.classList.add("exit");
        setTimeout(showQuestion, 220);
      }else{
        showFinal();
      }
    }

    function showFinal(){
      progress.style.width = "100%";
      counter.textContent = "💗";
      card.className = "card final enter";
      card.innerHTML = `
        <div class="emoji">💖🥹✨</div>
        <span class="eyebrow">Resultado oficial</span>
        <h2>APROBASTE 💘</h2>
        <p class="love">
          SE HIZO POR DIVERSIÓN.<br><br>
          NO TE OLVIDES QUE TE AMO MUCHO. ❤️
        </p>
        <button class="kiss" id="kissBtn" aria-label="Sorpresa">🫶</button>
        <button class="primary" id="againBtn">Volver a jugar 🔁💞</button>
        <div class="tiny">Toca el beso. Es científicamente importante. 👩‍🔬💗</div>
      `;

      document.getElementById("kissBtn").addEventListener("click",(e)=>{
        vibrate([35,40,35]);
        burst(e.clientX || innerWidth/2, e.clientY || innerHeight/2, 40);
        document.getElementById("kissBtn").textContent = "🥰";
      });

      document.getElementById("againBtn").addEventListener("click",(e)=>{
        burst(e.clientX || innerWidth/2, e.clientY || innerHeight/2, 18);
        current = 0;
        showQuestion();
      });

      setTimeout(()=>{
        burst(innerWidth/2, innerHeight/2, 30);
      }, 250);
      window.scrollTo({top:0, behavior:"smooth"});
    }

    createAmbient();
    intro();
  </script>
</body>
</html>
